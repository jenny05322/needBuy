<!doctype html>
<html lang="zh-TW">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>商店口袋名單</title>
        <link rel="stylesheet" href="style.css" />
        <style>
            :root {
                --color-primary: #f5576c;
                --color-primary-light: #fff0f3;
                --header-bg: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
                --card-img-bg: #fef0f2;
                --card-img-color: #f5576c;
            }
            .card-img img {
                object-fit: cover;
            }
            .tag-city {
                background: #f0f5ff;
                color: #2f54eb;
            }
            .tag-type {
                background: #fff0f6;
                color: #eb2f96;
            }
            .card-note {
                font-size: 0.88rem;
                color: #555;
                line-height: 1.6;
                white-space: pre-line;
            }
            .card-link {
                color: #1677ff;
                text-decoration: none;
                display: inline-flex;
                align-items: center;
                gap: 4px;
                padding: 4px 0;
                word-break: break-all;
            }
            .card-link:hover {
                text-decoration: underline;
            }
        </style>
    </head>
    <body>
        <header>
            <h1>商店口袋名單</h1>
            <div class="header-right">
                <a class="nav-link" href="index.html">
                    <svg
                        xmlns="http://www.w3.org/2000/svg"
                        fill="none"
                        viewBox="0 0 24 24"
                        stroke-width="1.5"
                        stroke="currentColor"
                        width="18"
                        height="18"
                    >
                        <path
                            stroke-linecap="round"
                            stroke-linejoin="round"
                            d="m2.25 12 8.954-8.955c.44-.439 1.152-.439 1.591 0L21.75 12M4.5 9.75v10.125c0 .621.504 1.125 1.125 1.125H9.75v-4.875c0-.621.504-1.125 1.125-1.125h2.25c.621 0 1.125.504 1.125 1.125V21h4.125c.621 0 1.125-.504 1.125-1.125V9.75M8.25 21h8.25"
                        />
                    </svg>
                    首頁
                </a>
                <a class="nav-link" href="products.html">
                    <svg
                        xmlns="http://www.w3.org/2000/svg"
                        fill="none"
                        viewBox="0 0 24 24"
                        stroke-width="1.5"
                        stroke="currentColor"
                        width="18"
                        height="18"
                    >
                        <path
                            stroke-linecap="round"
                            stroke-linejoin="round"
                            d="M15.75 10.5V6a3.75 3.75 0 1 0-7.5 0v4.5m11.356-1.993 1.263 12c.07.665-.45 1.243-1.119 1.243H4.25a1.125 1.125 0 0 1-1.12-1.243l1.264-12A1.125 1.125 0 0 1 5.513 7.5h12.974c.576 0 1.059.435 1.119 1.007ZM8.625 10.5a.375.375 0 1 1-.75 0 .375.375 0 0 1 .75 0Zm7.5 0a.375.375 0 1 1-.75 0 .375.375 0 0 1 .75 0Z"
                        />
                    </svg>
                    物品
                </a>
                <button
                    class="btn btn-primary"
                    id="addBtn"
                    onclick="openAddModal()"
                    style="display: none"
                >
                    <svg
                        xmlns="http://www.w3.org/2000/svg"
                        fill="none"
                        viewBox="0 0 24 24"
                        stroke-width="1.5"
                        stroke="currentColor"
                        width="18"
                        height="18"
                    >
                        <path
                            stroke-linecap="round"
                            stroke-linejoin="round"
                            d="M12 4.5v15m7.5-7.5h-15"
                        />
                    </svg>
                    新增
                </button>
            </div>
        </header>

        <div class="toolbar" id="toolbar" style="display: none">
            <input
                class="search-box"
                id="searchInput"
                type="text"
                placeholder="搜尋商店名稱、城市、類型…"
                oninput="renderCards()"
            />
            <select class="filter-select" id="typeFilter" onchange="renderCards()">
                <option value="">所有類型</option>
            </select>
            <select class="filter-select" id="countryFilter" onchange="renderCards()">
                <option value="">所有國家</option>
            </select>

            <span class="stats" id="statsText"></span>
        </div>

        <div class="setup-banner" id="setupBanner">
            <div class="icon">
                <svg
                    xmlns="http://www.w3.org/2000/svg"
                    fill="none"
                    viewBox="0 0 24 24"
                    stroke-width="1.5"
                    stroke="currentColor"
                    width="64"
                    height="64"
                >
                    <path
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        d="M9 6.75V15m6-6v8.25m.503 3.498 4.875-2.437c.381-.19.622-.58.622-1.006V4.82c0-.836-.88-1.38-1.628-1.006l-3.869 1.934c-.317.159-.69.159-1.006 0L9.503 3.252a1.125 1.125 0 0 0-1.006 0L3.622 5.689C3.24 5.88 3 6.27 3 6.695V19.18c0 .836.88 1.38 1.628 1.006l3.869-1.934c.317-.159.69-.159 1.006 0l4.994 2.497c.317.159.69.159 1.006 0Z"
                    />
                </svg>
            </div>
            <h2>尚未連結 Google Sheets</h2>
            <p>請先到首頁設定 Apps Script 網址。</p>
            <a href="index.html" class="btn btn-primary">
                <svg
                    xmlns="http://www.w3.org/2000/svg"
                    fill="none"
                    viewBox="0 0 24 24"
                    stroke-width="1.5"
                    stroke="currentColor"
                    width="18"
                    height="18"
                >
                    <path
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        d="m2.25 12 8.954-8.955c.44-.439 1.152-.439 1.591 0L21.75 12M4.5 9.75v10.125c0 .621.504 1.125 1.125 1.125H9.75v-4.875c0-.621.504-1.125 1.125-1.125h2.25c.621 0 1.125.504 1.125 1.125V21h4.125c.621 0 1.125-.504 1.125-1.125V9.75M8.25 21h8.25"
                    />
                </svg>
                回首頁設定
            </a>
        </div>

        <div class="grid" id="cardGrid"></div>

        <div class="loading-overlay" id="loadingOverlay">
            <div class="spinner"></div>
            <div id="loadingText">載入中…</div>
        </div>

        <div class="overlay" id="formOverlay">
            <div class="modal">
                <div class="modal-header">
                    <h2 id="formTitle">新增商店</h2>
                    <button class="close-btn" onclick="closeFormModal()">
                        <svg
                            xmlns="http://www.w3.org/2000/svg"
                            fill="none"
                            viewBox="0 0 24 24"
                            stroke-width="1.5"
                            stroke="currentColor"
                            width="20"
                            height="20"
                        >
                            <path
                                stroke-linecap="round"
                                stroke-linejoin="round"
                                d="M6 18 18 6M6 6l12 12"
                            />
                        </svg>
                    </button>
                </div>
                <div class="modal-body">
                    <div class="form-row">
                        <div class="form-group">
                            <label>商店名稱 *</label>
                            <input type="text" id="fName" placeholder="例：唐吉訶德" />
                        </div>
                        <div class="form-group">
                            <label>類型</label>
                            <input type="text" id="fType" placeholder="例：藥妝" list="typeList" />
                            <datalist id="typeList"></datalist>
                        </div>
                    </div>
                    <div class="form-row-3">
                        <div class="form-group">
                            <label>國家</label>
                            <input
                                type="text"
                                id="fCountry"
                                placeholder="例：日本"
                                list="countryList"
                            />
                            <datalist id="countryList"></datalist>
                        </div>
                        <div class="form-group">
                            <label>城市</label>
                            <input type="text" id="fCity" placeholder="例：大阪" list="cityList" />
                            <datalist id="cityList"></datalist>
                        </div>
                        <div class="form-group">
                            <label>評分</label>
                            <div class="star-input" id="starInput">
                                <span data-v="1" onclick="setStar(1)"></span>
                                <span data-v="2" onclick="setStar(2)"></span>
                                <span data-v="3" onclick="setStar(3)"></span>
                                <span data-v="4" onclick="setStar(4)"></span>
                                <span data-v="5" onclick="setStar(5)"></span>
                            </div>
                        </div>
                    </div>
                    <div class="form-group">
                        <label>地址</label>
                        <input type="text" id="fAddress" placeholder="例：大阪府大阪市…" />
                    </div>
                    <div class="form-group">
                        <label>網址 / Google Maps 連結</label>
                        <input type="url" id="fUrl" placeholder="https://…" />
                    </div>
                    <div class="form-group">
                        <label>商店圖片網址</label>
                        <input
                            type="url"
                            id="fImgUrl"
                            placeholder="https://…"
                            oninput="handleUrlInput(this.value)"
                        />
                        <img
                            id="imgPreview"
                            style="
                                width: 100%;
                                max-height: 180px;
                                object-fit: cover;
                                margin-top: 8px;
                                display: none;
                            "
                        />
                    </div>
                    <div class="form-group">
                        <label>備註</label>
                        <textarea
                            id="fNote"
                            placeholder="想去的原因、必買商品、注意事項…"
                        ></textarea>
                    </div>
                </div>
                <div class="modal-footer">
                    <button class="btn btn-cancel" onclick="closeFormModal()">取消</button>
                    <button class="btn btn-save" id="saveBtn" onclick="saveRecord()">儲存</button>
                </div>
            </div>
        </div>

        <div class="toast" id="toast"></div>

        <script src="icons.js"></script>
        <script src="common.js"></script>
        <script src="shops.js"></script>
    </body>
</html>
