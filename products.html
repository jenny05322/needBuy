<!doctype html>
<html lang="zh-TW">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>物品使用心得</title>
        <link rel="stylesheet" href="style.css" />
        <style>
            :root {
                --color-primary: #667eea;
                --color-primary-light: #f0edff;
                --header-bg: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            }
            .tag-shop {
                background: #f6ffed;
                color: #389e0d;
            }
            .tag-price {
                background: #fff7e6;
                color: #d46b08;
                font-weight: 700;
            }
            .card-review {
                font-size: 0.88rem;
                color: #555;
                line-height: 1.6;
                white-space: pre-line;
            }
        </style>
    </head>
    <body>
        <header>
            <h1>物品使用心得</h1>
            <div class="header-right">
                <a class="nav-link" href="index.html">
                    <svg
                        xmlns="http://www.w3.org/2000/svg"
                        fill="none"
                        viewBox="0 0 24 24"
                        stroke-width="1.5"
                        stroke="currentColor"
                        width="18"
                        height="18"
                    >
                        <path
                            stroke-linecap="round"
                            stroke-linejoin="round"
                            d="m2.25 12 8.954-8.955c.44-.439 1.152-.439 1.591 0L21.75 12M4.5 9.75v10.125c0 .621.504 1.125 1.125 1.125H9.75v-4.875c0-.621.504-1.125 1.125-1.125h2.25c.621 0 1.125.504 1.125 1.125V21h4.125c.621 0 1.125-.504 1.125-1.125V9.75M8.25 21h8.25"
                        />
                    </svg>
                    首頁
                </a>
                <a class="nav-link" href="shops.html">
                    <svg
                        xmlns="http://www.w3.org/2000/svg"
                        fill="none"
                        viewBox="0 0 24 24"
                        stroke-width="1.5"
                        stroke="currentColor"
                        width="18"
                        height="18"
                    >
                        <path
                            stroke-linecap="round"
                            stroke-linejoin="round"
                            d="M9 6.75V15m6-6v8.25m.503 3.498 4.875-2.437c.381-.19.622-.58.622-1.006V4.82c0-.836-.88-1.38-1.628-1.006l-3.869 1.934c-.317.159-.69.159-1.006 0L9.503 3.252a1.125 1.125 0 0 0-1.006 0L3.622 5.689C3.24 5.88 3 6.27 3 6.695V19.18c0 .836.88 1.38 1.628 1.006l3.869-1.934c.317-.159.69-.159 1.006 0l4.994 2.497c.317.159.69.159 1.006 0Z"
                        />
                    </svg>
                    商店
                </a>
                <button
                    class="btn btn-primary"
                    id="addBtn"
                    onclick="openAddModal()"
                    style="display: none"
                >
                    <svg
                        xmlns="http://www.w3.org/2000/svg"
                        fill="none"
                        viewBox="0 0 24 24"
                        stroke-width="1.5"
                        stroke="currentColor"
                        width="18"
                        height="18"
                    >
                        <path
                            stroke-linecap="round"
                            stroke-linejoin="round"
                            d="M12 4.5v15m7.5-7.5h-15"
                        />
                    </svg>
                    新增
                </button>
            </div>
        </header>

        <div class="toolbar" id="toolbar" style="display: none">
            <input
                class="search-box"
                id="searchInput"
                type="text"
                placeholder="搜尋物品名稱、品牌、國家…"
                oninput="renderCards()"
            />
            <select class="filter-select" id="countryFilter" onchange="renderCards()">
                <option value="">所有國家</option>
            </select>
            <select class="filter-select" id="ratingFilter" onchange="renderCards()">
                <option value="">所有評分</option>
                <option value="5">5 星</option>
                <option value="4">4 星以上</option>
                <option value="3">3 星以上</option>
            </select>
            <span class="stats" id="statsText"></span>
        </div>

        <div class="setup-banner" id="setupBanner">
            <div class="icon">
                <svg
                    xmlns="http://www.w3.org/2000/svg"
                    fill="none"
                    viewBox="0 0 24 24"
                    stroke-width="1.5"
                    stroke="currentColor"
                    width="64"
                    height="64"
                >
                    <path
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        d="M3 13.125C3 12.504 3.504 12 4.125 12h2.25c.621 0 1.125.504 1.125 1.125v6.75C7.5 20.496 6.996 21 6.375 21h-2.25A1.125 1.125 0 0 1 3 19.875v-6.75ZM9.75 8.625c0-.621.504-1.125 1.125-1.125h2.25c.621 0 1.125.504 1.125 1.125v11.25c0 .621-.504 1.125-1.125 1.125h-2.25a1.125 1.125 0 0 1-1.125-1.125V8.625ZM16.5 4.125c0-.621.504-1.125 1.125-1.125h2.25C20.496 3 21 3.504 21 4.125v15.75c0 .621-.504 1.125-1.125 1.125h-2.25a1.125 1.125 0 0 1-1.125-1.125V4.125Z"
                    />
                </svg>
            </div>
            <h2>尚未連結 Google Sheets</h2>
            <p>請先到首頁設定 Apps Script 網址。</p>
            <a href="index.html" class="btn btn-primary">
                <svg
                    xmlns="http://www.w3.org/2000/svg"
                    fill="none"
                    viewBox="0 0 24 24"
                    stroke-width="1.5"
                    stroke="currentColor"
                    width="18"
                    height="18"
                >
                    <path
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        d="m2.25 12 8.954-8.955c.44-.439 1.152-.439 1.591 0L21.75 12M4.5 9.75v10.125c0 .621.504 1.125 1.125 1.125H9.75v-4.875c0-.621.504-1.125 1.125-1.125h2.25c.621 0 1.125.504 1.125 1.125V21h4.125c.621 0 1.125-.504 1.125-1.125V9.75M8.25 21h8.25"
                    />
                </svg>
                回首頁設定
            </a>
        </div>

        <div class="grid" id="cardGrid"></div>

        <div class="loading-overlay" id="loadingOverlay">
            <div class="spinner"></div>
            <div id="loadingText">載入中…</div>
        </div>

        <div class="overlay" id="formOverlay">
            <div class="modal">
                <div class="modal-header">
                    <h2 id="formTitle">新增記錄</h2>
                    <button class="close-btn" onclick="closeFormModal()">
                        <svg
                            xmlns="http://www.w3.org/2000/svg"
                            fill="none"
                            viewBox="0 0 24 24"
                            stroke-width="1.5"
                            stroke="currentColor"
                            width="20"
                            height="20"
                        >
                            <path
                                stroke-linecap="round"
                                stroke-linejoin="round"
                                d="M6 18 18 6M6 6l12 12"
                            />
                        </svg>
                    </button>
                </div>
                <div class="modal-body">
                    <div class="form-row">
                        <div class="form-group">
                            <label>物品名稱 *</label>
                            <input type="text" id="fName" placeholder="例：收納盒" />
                        </div>
                        <div class="form-group">
                            <label>品牌</label>
                            <input type="text" id="fBrand" placeholder="例：無印良品" />
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>分類</label>
                            <input type="text" id="fTags" placeholder="例：藥妝" list="tagsList" />
                            <datalist id="tagsList"></datalist>
                        </div>
                        <div class="form-group">
                            <label>評分</label>
                            <div class="star-input" id="starInput">
                                <span data-v="1" onclick="setStar(1)"></span>
                                <span data-v="2" onclick="setStar(2)"></span>
                                <span data-v="3" onclick="setStar(3)"></span>
                                <span data-v="4" onclick="setStar(4)"></span>
                                <span data-v="5" onclick="setStar(5)"></span>
                            </div>
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>國家</label>
                            <input
                                type="text"
                                id="fCountry"
                                placeholder="例：日本"
                                list="countryList"
                            />
                            <datalist id="countryList"></datalist>
                        </div>
                        <div class="form-group">
                            <label>購買點</label>
                            <input
                                type="text"
                                id="fShop"
                                placeholder="例：東京澀谷門市"
                                list="shopList"
                            />
                            <datalist id="shopList"></datalist>
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>幣別</label>
                            <input type="text" id="fCurrency" placeholder="JPY" list="currencyList">
                            <datalist id="currencyList"></datalist>
                        </div>
                        <div class="form-group">
                            <label>價格</label>
                            <input type="text" id="fPrice" placeholder="例：990" />
                        </div>
                    </div>
                    <div class="form-group">
                        <label>物品圖片網址</label>
                        <input
                            type="url"
                            id="fImgUrl"
                            placeholder="https://…"
                            oninput="handleUrlInput(this.value)"
                        />
                        <img
                            id="imgPreview"
                            style="
                                width: 100%;
                                max-height: 200px;
                                object-fit: contain;
                                border-radius: 8px;
                                margin-top: 8px;
                                display: none;
                            "
                        />
                    </div>
                    <div class="form-group">
                        <label>使用心得</label>
                        <textarea
                            id="fReview"
                            placeholder="描述你的使用感受、優缺點、推薦程度…"
                        ></textarea>
                    </div>
                </div>
                <div class="modal-footer">
                    <button class="btn btn-cancel" onclick="closeFormModal()">取消</button>
                    <button class="btn btn-save" id="saveBtn" onclick="saveRecord()">儲存</button>
                </div>
            </div>
        </div>

        <div class="toast" id="toast"></div>

        <script src="icons.js"></script>
        <script src="common.js"></script>
        <script src="products.js"></script>
    </body>
</html>
